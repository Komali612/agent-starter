[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-agent"                       # ← rename to your agent
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Pulled from the agent-core git repo by tag. For connector extras, use:
    #   "agent-core[jira,slack] @ git+https://github.com/Komali612/agent-core@v0.1.0"
    "agent-core @ git+https://github.com/Komali612/agent-core@v0.1.0",
]

[project.scripts]
agent = "agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
